[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bitcoin-block-analytics"
version = "0.1.0"
description = "High-performance Bitcoin block analytics with optional GPU acceleration"
readme = "README.md"
requires-python = ">=3.8,<3.12"
license = {text = "MIT"}
authors = [
    {name = "divok11231"}
]

dependencies = [
    "numpy",
    "pycuda",
    "requests"
]

[project.scripts]
bitcoin-analytics = "analyzer.cli:run"

